# Weekly updates. Each Dependabot pull request needs the Master's sign-off like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # three.js is pinned (README decision D1); the Engine Engineer upgrades it on purpose.
      - dependency-name: three
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "@types/three"
        update-types: [version-update:semver-minor, version-update:semver-major]
