# .github/workflows/pages.yml: deploys main, plus every milestone snapshot, to GitHub Pages.
# Rollback: gh workflow run pages.yml --ref main -f ref=<last good sha>
# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) updates them.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy as main (the last good one, to roll back)
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_BASE: /tuxedocafe/ # job-wide: vite preview and the tests read it too
      VITE_CHANNEL: main
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # tags, for git describe in version.json
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: List runtime assets in Git LFS
        run: git lfs ls-files --long --include "public/assets/**" | cut -d ' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - run: git lfs pull --include "public/assets/**"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run assets
      - name: Build original audio bank
        run: |
          if [ -f tools/audio/build-audio.ts ]; then
            if ! command -v ffmpeg > /dev/null; then
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
            node tools/audio/build-audio.ts
          fi
      - run: npm run check
      - run: npm run audio:check
      - run: npm run build
      - name: Fail on Git LFS pointers in the build
        run: if grep -rlI 'git-lfs.github.com/spec' dist; then exit 1; fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep screenshots and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Add milestone snapshots from GitHub Releases
        run: node .github/scripts/assemble-site.mjs dist _site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  live-smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run assets
      - name: Build original audio bank
        run: |
          if [ -f tools/audio/build-audio.ts ]; then
            if ! command -v ffmpeg > /dev/null; then
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
            node tools/audio/build-audio.ts
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          LIVE_URL: https://creditunionfruitfly.github.io/tuxedocafe/
          EXPECT_COMMIT: ${{ needs.build.outputs.commit }}
      - name: Keep screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-smoke-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
