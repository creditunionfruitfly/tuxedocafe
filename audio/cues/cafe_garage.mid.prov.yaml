notes: Swung sixteenth shakers, a displaced two-step kick and brush backbeat, clipped electric-piano offbeats, answering marimba and a broken bass line. Deterministic MIDI using the existing original bank; no recordings, borrowed melodies or third-party samples. Dedicated to the public domain under CC0-1.0.
